name: Deploy to Azure Static Web Apps

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

# pull-requests: write lets the SWA action post its "stage site is ready"
# comment with the preview URL on each PR; the default token is read-only
# and the comment silently fails without it.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    # Job-level so the deploy step's `if:` can read it — a secret cannot be
    # referenced from `if:` directly, and step-level env is not in scope for
    # the same step's condition.
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: ${{ secrets.NEXT_PUBLIC_HUBSPOT_PORTAL_ID }}
          NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID: ${{ secrets.NEXT_PUBLIC_HUBSPOT_CONTACT_FORM_ID }}
          NEXT_PUBLIC_GA_MEASUREMENT_ID: ${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}

      # Gated on the token being set: without it the action exits non-zero on
      # every run, so a red gate said nothing about the code and a genuine
      # build break looked identical to an unconfigured deploy. Deployment
      # resumes on its own once the secret exists — nothing here changes back.
      - name: Deploy to Azure Static Web Apps
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          skip_app_build: true
          app_location: "out"
          api_location: "api"
          output_location: ""

      - name: Note skipped deployment
        if: env.SWA_TOKEN == ''
        run: echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN is not set — build verified, deploy skipped."

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close PR Preview
    env:
      SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
    steps:
      - name: Close Pull Request
        if: env.SWA_TOKEN != ''
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          app_location: ""
